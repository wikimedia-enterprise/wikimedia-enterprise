include:
  - project: 'wikimedia-enterprise/general/cdtools'
    ref: main
    file: '/ci/goapp_eks.yml'

functional-test:
  extends: .test_functional_compose_go_tls
  stage: test
  tags:
    - wme-eks-generic-dv
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  variables:
    RUN_INTEGRATION_TESTS: "true"
    