include:
  - project: "wikimedia-enterprise/general/cdtools"
    ref: main
    file: "/ci/go_multiple_apps_eks.yml"
  - project: "wikimedia-enterprise/general/cdtools"
    ref: main
    file: "/ci/deploy/prep_argocd.yml"

stages:
  - test
  - analyses
  - build
  - push
  - app-restart

#---------------------
# Service definitions
#---------------------
.articlebulk:
  variables:
    HANDLER: articlebulk
    ECR_REPO: $ECR_REPO_ARTICLEBULK
    IMAGE_NAME: $IMAGE_NAME_ARTICLEBULK
    SERVICE_NAME: $SERVICE_NAME_ARTICLEBULK

.articledelete:
  variables:
    HANDLER: articledelete
    ECR_REPO: $ECR_REPO_ARTICLEDELETE
    IMAGE_NAME: $IMAGE_NAME_ARTICLEDELETE
    SERVICE_NAME: $SERVICE_NAME_ARTICLEDELETE

.articleupdate:
  variables:
    HANDLER: articleupdate
    ECR_REPO: $ECR_REPO_ARTICLEUPDATE
    IMAGE_NAME: $IMAGE_NAME_ARTICLEUPDATE
    SERVICE_NAME: $SERVICE_NAME_ARTICLEUPDATE

.articlevisibility:
  variables:
    HANDLER: articlevisibility
    ECR_REPO: $ECR_REPO_ARTICLEVISIBILITY
    IMAGE_NAME: $IMAGE_NAME_ARTICLEVISIBILITY
    SERVICE_NAME: $SERVICE_NAME_ARTICLEVISIBILITY

#-----------------
# Build Stage Jobs DEV
#-----------------
build:dev:articlebulk:
  extends:
    - .articlebulk
    - .build_dev

build:dev:articledelete:
  extends:
    - .articledelete
    - .build_dev

build:dev:articleupdate:
  extends:
    - .articleupdate
    - .build_dev

build:dev:articlevisibility:
  extends:
    - .articlevisibility
    - .build_dev

#-----------------
# Build Stage Jobs PROD
#-----------------
build:prod:articlebulk:
  extends:
    - .articlebulk
    - .build_prod

build:prod:articledelete:
  extends:
    - .articledelete
    - .build_prod

build:prod:articleupdate:
  extends:
    - .articleupdate
    - .build_prod

build:prod:articlevisibility:
  extends:
    - .articlevisibility
    - .build_prod

#-----------------
# Push Jobs DEV
#-----------------
push:dev:articlebulk:
  extends:
    - .articlebulk
    - .push_dev

push:dev:articledelete:
  extends:
    - .articledelete
    - .push_dev

push:dev:articleupdate:
  extends:
    - .articleupdate
    - .push_dev

push:dev:articlevisibility:
  extends:
    - .articlevisibility
    - .push_dev

#-----------------
# Push Jobs PROD
#-----------------
push:prod:articlebulk:
  extends:
    - .articlebulk
    - .push_prod

push:prod:articledelete:
  extends:
    - .articledelete
    - .push_prod

push:prod:articleupdate:
  extends:
    - .articleupdate
    - .push_prod

push:prod:articlevisibility:
  extends:
    - .articlevisibility
    - .push_prod
